<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinancIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #e8efe9;
    --superficie: #f6f9f5;
    --tinta: #17261f;
    --tenue: #5b6d63;
    --linea: #c7d4ca;
    --verde: #1d6b4f;
    --gasto: #9c2f55;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --texto: "Figtree", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--tinta); font: 16px/1.5 var(--texto); }
  main { max-width: 560px; margin: 0 auto; padding: 28px 20px 60px; }

  header h1 { font: 700 1.5rem/1 var(--display); margin: 0 0 20px; letter-spacing: -0.02em; }
  .resumen { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 1px; background: var(--linea);
             border: 1px solid var(--linea); border-radius: 14px; overflow: hidden; }
  .resumen div { background: var(--superficie); padding: 12px 14px; }
  .resumen span { display: block; font-size: 0.8rem; color: var(--tenue); }
  .resumen strong { font: 700 1.15rem/1.3 var(--display); font-variant-numeric: tabular-nums; }
  .resumen .principal strong { font-size: 1.5rem; }

  .grabar { display: grid; justify-items: center; gap: 14px; margin: 44px 0 30px; text-align: center; }
  #mic { position: relative; width: 132px; height: 132px; border-radius: 50%; border: 0; cursor: pointer;
         background: var(--verde); color: #fff; display: grid; place-items: center;
         box-shadow: 0 10px 30px -10px rgba(29, 107, 79, 0.7); transition: transform 0.15s ease, background 0.2s; }
  #mic:hover { transform: scale(1.03); }
  #mic:focus-visible { outline: 3px solid var(--tinta); outline-offset: 5px; }
  #mic svg { width: 46px; height: 46px; }
  #mic.grabando { background: var(--gasto); }
  #mic.grabando::after { content: ""; position: absolute; inset: -10px; border-radius: 50%;
                         border: 3px solid var(--gasto); animation: pulso 1.3s ease-out infinite; }
  #mic:disabled { opacity: 0.55; cursor: wait; transform: none; }
  @keyframes pulso { from { opacity: 0.8; transform: scale(0.95); } to { opacity: 0; transform: scale(1.25); } }
  .ayuda { color: var(--tenue); margin: 0; max-width: 34ch; }
  #estado { min-height: 3em; margin: 0; font-weight: 500; max-width: 42ch; }
  #estado.ok { color: var(--verde); }
  #estado.error { color: var(--gasto); }
  #estado small { display: block; font-weight: 400; color: var(--tenue); }

  form { display: flex; gap: 8px; margin-bottom: 36px; }
  form label { position: absolute; left: -9999px; }
  input { flex: 1; min-width: 0; font: inherit; padding: 11px 14px; border: 1px solid var(--linea);
          border-radius: 10px; background: var(--superficie); color: var(--tinta); }
  input:focus-visible, form button:focus-visible { outline: 2px solid var(--verde); outline-offset: 2px; }
  form button { font: 600 0.95rem var(--texto); padding: 0 16px; border-radius: 10px; border: 1px solid var(--tinta);
                background: var(--tinta); color: #fff; cursor: pointer; }
  form button:disabled { opacity: 0.55; cursor: wait; }

  h2 { font: 700 1.1rem var(--display); margin: 0 0 8px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 0; border-bottom: 1px solid var(--linea); }
  li .desc { font-weight: 500; }
  li .meta { font-size: 0.82rem; color: var(--tenue); grid-column: 1; }
  li .monto { grid-row: 1 / span 2; grid-column: 2; align-self: center; font: 700 1rem var(--display);
              font-variant-numeric: tabular-nums; }
  .ingreso .monto { color: var(--verde); }
  .gasto .monto { color: var(--gasto); }
  li.nuevo { animation: aparecer 0.6s ease; }
  @keyframes aparecer { from { background: #d5e6da; } to { background: transparent; } }
  .vacio { color: var(--tenue); padding: 12px 0; }

  @media (max-width: 420px) {
    .resumen { grid-template-columns: 1fr 1fr; }
    .resumen .principal { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>FinancIA</h1>
    <section class="resumen" aria-label="Resumen de tus finanzas">
      <div class="principal"><span>Balance</span><strong id="balance">$0</strong></div>
      <div><span>Ingresos</span><strong id="ingresos">$0</strong></div>
      <div><span>Gastos</span><strong id="gastos">$0</strong></div>
    </section>
  </header>

  <section class="grabar">
    <button id="mic" type="button" aria-label="Empezar a grabar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="17" x2="12" y2="22"/>
      </svg>
    </button>
    <p class="ayuda">Toca el micrófono y di algo como "gasté 25 mil en almuerzo" o "me pagaron un palo".</p>
    <p id="estado" role="status" aria-live="polite"></p>
  </section>

  <form id="form-texto">
    <label for="texto">Escribir un movimiento</label>
    <input id="texto" placeholder="O escríbelo: pagué 80 lucas de internet" maxlength="300" autocomplete="off">
    <button type="submit">Registrar</button>
  </form>

  <section>
    <h2>Últimos movimientos</h2>
    <ul id="lista"><li class="vacio">Aún no hay movimientos. Registra el primero con tu voz.</li></ul>
  </section>
</main>

<script>
const pesos = new Intl.NumberFormat("es-CO", { style: "currency", currency: "COP", maximumFractionDigits: 0 });
const NOMBRES = { alimentacion: "Alimentación", transporte: "Transporte", vivienda: "Vivienda", servicios: "Servicios",
  salud: "Salud", educacion: "Educación", entretenimiento: "Entretenimiento", compras: "Compras",
  salario: "Salario", ventas: "Ventas", otros: "Otros" };
const ORIGEN = { voz: "por voz", texto: "por texto", manual: "manual" };
const MAX_SEGUNDOS = 30;

const mic = document.getElementById("mic");
const estado = document.getElementById("estado");
const form = document.getElementById("form-texto");
const campo = document.getElementById("texto");
let grabador = null, trozos = [], temporizador = null;

function mostrar(texto, clase = "", detalle = "") {
  estado.className = clase;
  estado.textContent = texto;
  if (detalle) { const s = document.createElement("small"); s.textContent = detalle; estado.appendChild(s); }
}

function ocupado(si) { mic.disabled = si; form.querySelector("button").disabled = si; }

async function cargar(idNuevo = null) {
  const [b, m] = await Promise.all([fetch("/balance").then(r => r.json()), fetch("/movimientos?limite=15").then(r => r.json())]);
  document.getElementById("balance").textContent = pesos.format(b.balance);
  document.getElementById("ingresos").textContent = pesos.format(b.ingresos);
  document.getElementById("gastos").textContent = pesos.format(b.gastos);
  const lista = document.getElementById("lista");
  lista.replaceChildren();
  if (!m.length) {
    const li = document.createElement("li"); li.className = "vacio";
    li.textContent = "Aún no hay movimientos. Registra el primero con tu voz."; lista.appendChild(li); return;
  }
  for (const mov of m) {
    const li = document.createElement("li");
    li.className = mov.tipo + (mov.id === idNuevo ? " nuevo" : "");
    const desc = document.createElement("span"); desc.className = "desc";
    desc.textContent = mov.descripcion || NOMBRES[mov.categoria] || mov.categoria;
    const meta = document.createElement("span"); meta.className = "meta";
    const fecha = new Date(mov.fecha).toLocaleDateString("es-CO", { day: "numeric", month: "short" });
    meta.textContent = `${NOMBRES[mov.categoria] || mov.categoria}, ${fecha}, ${ORIGEN[mov.origen] || mov.origen}`;
    const monto = document.createElement("span"); monto.className = "monto";
    monto.textContent = (mov.tipo === "gasto" ? "−" : "+") + pesos.format(mov.monto);
    li.append(desc, meta, monto);
    lista.appendChild(li);
  }
}

async function esperarResultado(id) {
  for (let i = 0; i < 60; i++) {
    await new Promise(r => setTimeout(r, i < 5 ? 600 : 1200));
    const s = await fetch(`/solicitudes/${id}`).then(r => r.json());
    if (s.estado === "completada") {
      const m = s.movimiento;
      const que = m.tipo === "gasto" ? "Gasto" : "Ingreso";
      mostrar(`${que} registrado: ${pesos.format(m.monto)} en ${(NOMBRES[m.categoria] || m.categoria).toLowerCase()}.`, "ok",
              s.transcripcion ? `Entendí: "${s.transcripcion}"` : "");
      await cargar(m.id);
      return;
    }
    if (s.estado === "rechazada" || s.estado === "error") {
      mostrar(s.mensaje || "No se pudo registrar.", "error", s.transcripcion ? `Entendí: "${s.transcripcion}"` : "");
      return;
    }
  }
  mostrar("El registro está tardando más de lo normal. Revisa la lista en un momento.", "error");
}

async function enviar(peticion) {
  ocupado(true);
  mostrar("Interpretando…");
  try {
    const r = await peticion();
    const s = await r.json();
    if (!r.ok) { mostrar(s.detail || "No se pudo enviar.", "error"); return; }
    await esperarResultado(s.id);
  } catch {
    mostrar("No hay conexión con el servidor.", "error");
  } finally {
    ocupado(false);
  }
}

function tipoAudio() {
  for (const t of ["audio/webm;codecs=opus", "audio/ogg;codecs=opus", "audio/mp4"])
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
  return "";
}

async function empezar() {
  let flujo;
  try {
    flujo = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch {
    mostrar("No tengo permiso para usar el micrófono. Actívalo en el navegador o escribe el movimiento.", "error");
    return;
  }
  const tipo = tipoAudio();
  grabador = new MediaRecorder(flujo, tipo ? { mimeType: tipo } : undefined);
  trozos = [];
  grabador.ondataavailable = e => e.data.size && trozos.push(e.data);
  grabador.onstop = () => {
    flujo.getTracks().forEach(t => t.stop());
    const blob = new Blob(trozos, { type: grabador.mimeType || "audio/webm" });
    const datos = new FormData();
    datos.append("audio", blob, "grabacion");
    enviar(() => fetch("/voz", { method: "POST", body: datos }));
  };
  grabador.start();
  mic.classList.add("grabando");
  mic.setAttribute("aria-label", "Detener la grabación");
  let s = 0;
  mostrar(`Escuchando… 0 s`);
  temporizador = setInterval(() => { s++; mostrar(`Escuchando… ${s} s`); if (s >= MAX_SEGUNDOS) detener(); }, 1000);
}

function detener() {
  clearInterval(temporizador);
  mic.classList.remove("grabando");
  mic.setAttribute("aria-label", "Empezar a grabar");
  if (grabador && grabador.state === "recording") grabador.stop();
}

mic.addEventListener("click", () => (grabador && grabador.state === "recording") ? detener() : empezar());

form.addEventListener("submit", e => {
  e.preventDefault();
  const texto = campo.value.trim();
  if (texto.length < 2) return;
  campo.value = "";
  enviar(() => fetch("/texto", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ texto }) }));
});

if (!navigator.mediaDevices || !window.MediaRecorder) {
  mic.disabled = true;
  mostrar("Este navegador no permite grabar audio. Puedes escribir el movimiento.", "error");
}
cargar().catch(() => mostrar("No hay conexión con el servidor.", "error"));
</script>
</body>
</html>
